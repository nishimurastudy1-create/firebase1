<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — 歴史タイムライン</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    body { background: var(--c-bg); }
    .login-page {
      min-height: calc(100vh - 52px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border-lt);
      border-radius: var(--r-xl);
      width: 100%; max-width: 400px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .card-top {
      background: var(--c-primary-lt);
      padding: 28px 28px 22px;
      text-align: center;
      border-bottom: 1px solid var(--c-border-lt);
    }
    .card-icon {
      width: 52px; height: 52px;
      border-radius: var(--r-xl);
      background: var(--c-primary);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      color: #fff; font-size: 24px;
    }
    .card-title { font-family: var(--font-serif); font-size: 19px; font-weight: 700; color: var(--c-primary-dk); margin-bottom: 4px; }
    .card-sub   { font-size: 12px; color: var(--c-text-2); }

    /* タブ */
    .inner-tabs { display: flex; border-bottom: 1px solid var(--c-border-lt); }
    .inner-tab {
      flex: 1; text-align: center; padding: 12px;
      font-size: 13px; cursor: pointer;
      color: var(--c-text-2);
      border-bottom: 2.5px solid transparent;
      transition: all var(--dur);
      background: none; border-top: none; border-left: none; border-right: none;
      font-family: var(--font-ja);
    }
    .inner-tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 500; }
    .inner-tab:hover:not(.on) { background: var(--c-bg); color: var(--c-text); }

    /* パネル */
    .panel { padding: 24px 28px; display: none; flex-direction: column; gap: 14px; }
    .panel.on { display: flex; }

    /* ソーシャルボタン */
    .social-btn {
      display: flex; align-items: center;
      width: 100%; padding: 10px 16px;
      border-radius: var(--r-lg);
      border: 1px solid var(--c-border);
      background: var(--c-surface);
      font-size: 13px; cursor: pointer;
      color: var(--c-text);
      transition: background var(--dur);
      font-family: var(--font-ja);
      gap: 10px;
    }
    .social-btn:hover { background: var(--c-bg); }
    .social-icon {
      width: 22px; height: 22px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .si-google { background: #fff; border: 1px solid #ddd; }
    .si-x { background: #000; color: #fff; font-size: 12px; }
    .social-label { flex: 1; text-align: center; }

    /* 区切り */
    .divider { display: flex; align-items: center; gap: 10px; }
    .div-line { flex: 1; height: 1px; background: var(--c-border-lt); }
    .div-text  { font-size: 11px; color: var(--c-text-3); }

    .forgot { text-align: right; }
    .forgot a { font-size: 12px; color: var(--c-primary); cursor: pointer; }

    /* パスワード強度 */
    .pw-bars { display: flex; gap: 4px; margin-top: 4px; }
    .pw-bar { flex: 1; height: 3px; border-radius: 99px; background: var(--c-border); }
    .pw-bar.s1 { background: var(--c-sen); }
    .pw-bar.s2 { background: var(--c-imp-a); }
    .pw-bar.s3,.pw-bar.s4 { background: var(--c-primary); }
    .pw-label { font-size: 11px; color: var(--c-text-3); margin-top: 3px; }

    .terms-note {
      font-size: 11px; color: var(--c-text-3);
      text-align: center; line-height: 1.7;
    }
    .terms-note a { color: var(--c-primary); }
  </style>
</head>
<body>

<div id="topbar-placeholder"></div>
<div id="toast-container"></div>

<div class="login-page">
  <div class="login-card">

    <div class="card-top">
      <div class="card-icon"><i class="ti ti-book-2"></i></div>
      <div class="card-title">歴史タイムライン</div>
      <div class="card-sub">クイズ・ランキングのご利用にはログインが必要です</div>
    </div>

    <div class="inner-tabs">
      <button class="inner-tab on" onclick="switchTab('login',this)">ログイン</button>
      <button class="inner-tab"    onclick="switchTab('register',this)">新規登録</button>
    </div>

    <!-- ログインパネル -->
    <div class="panel on" id="panel-login">

      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="social-btn" id="btn-google-login">
          <div class="social-icon si-google">
            <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          </div>
          <span class="social-label">Googleでログイン</span>
        </button>
      </div>

      <div class="divider">
        <div class="div-line"></div>
        <span class="div-text">またはメールアドレスで</span>
        <div class="div-line"></div>
      </div>

      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="login-email" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
        <div class="forgot"><a onclick="switchTab('reset',document.querySelectorAll('.inner-tab')[0])">パスワードを忘れた方</a></div>
      </div>

      <div class="msg msg-err" id="login-err" style="display:none">
        <i class="ti ti-alert-circle"></i><span id="login-err-text"></span>
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" id="btn-email-login">
        <i class="ti ti-login"></i>ログイン
      </button>

      <div class="terms-note">
        ログインすることで<a href="terms.html">利用規約</a>および<a href="privacy.html">プライバシーポリシー</a>に同意したものとみなします
      </div>
    </div>

    <!-- 新規登録パネル -->
    <div class="panel" id="panel-register">

      <button class="social-btn" id="btn-google-register">
        <div class="social-icon si-google">
          <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        </div>
        <span class="social-label">Googleで登録</span>
      </button>

      <div class="divider">
        <div class="div-line"></div>
        <span class="div-text">またはメールアドレスで</span>
        <div class="div-line"></div>
      </div>

      <div class="field">
        <label>表示名（ランキングに使用）</label>
        <input type="text" id="reg-name" placeholder="例：rekishi_master" autocomplete="nickname">
      </div>
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="reg-email" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>パスワード（6文字以上）</label>
        <input type="password" id="reg-pw" placeholder="••••••••" autocomplete="new-password" oninput="updateStrength(this.value)">
        <div class="pw-bars">
          <div class="pw-bar" id="pb1"></div>
          <div class="pw-bar" id="pb2"></div>
          <div class="pw-bar" id="pb3"></div>
          <div class="pw-bar" id="pb4"></div>
        </div>
        <div class="pw-label" id="pw-label">パスワードを入力してください</div>
      </div>

      <div class="msg msg-err" id="reg-err" style="display:none">
        <i class="ti ti-alert-circle"></i><span id="reg-err-text"></span>
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" id="btn-register">
        <i class="ti ti-user-plus"></i>アカウントを作成
      </button>

      <div class="terms-note">
        登録することで<a href="terms.html">利用規約</a>および<a href="privacy.html">プライバシーポリシー</a>に同意したものとみなします
      </div>
    </div>

    <!-- パスワードリセットパネル -->
    <div class="panel" id="panel-reset">
      <div class="msg msg-info" style="display:flex">
        <i class="ti ti-info-circle"></i>
        <span>登録済みのメールアドレスにパスワードリセットメールを送信します</span>
      </div>
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="reset-email" placeholder="example@email.com">
      </div>
      <div class="msg msg-ok" id="reset-ok" style="display:none">
        <i class="ti ti-check"></i><span>送信しました。メールをご確認ください。</span>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" id="btn-reset">
        <i class="ti ti-send"></i>リセットメールを送信
      </button>
      <div style="text-align:center">
        <a style="font-size:12px;color:var(--c-primary);cursor:pointer" onclick="switchTab('login',document.querySelectorAll('.inner-tab')[0])">
          ← ログインに戻る
        </a>
      </div>
    </div>

  </div>
</div>

<div id="toast-container"></div>

<script type="module">
  import { initThemeSwitcher, renderTopbar, toast } from "./js/firebase.js";
  import {
    loginWithGoogle, loginWithEmail,
    registerWithEmail, sendResetEmail, authErrorMessage
  } from "./js/auth.js";

  document.getElementById("topbar-placeholder").outerHTML = renderTopbar("");
  initThemeSwitcher();

  // リダイレクト先
  const params   = new URLSearchParams(location.search);
  const redirect = params.get("redirect") || "index.html";

  function showErr(panelId, msg) {
    const el   = document.getElementById(panelId + "-err");
    const text = document.getElementById(panelId + "-err-text");
    if (el && text) { el.style.display = "flex"; text.textContent = msg; }
  }
  function hideErr(panelId) {
    const el = document.getElementById(panelId + "-err");
    if (el) el.style.display = "none";
  }

  // ============================================================
  //  タブ切り替え
  // ============================================================
  window.switchTab = function(name, el) {
    document.querySelectorAll(".inner-tab").forEach(t => t.classList.remove("on"));
    document.querySelectorAll(".panel").forEach(p => { p.classList.remove("on"); p.style.display = "none"; });
    if (el) el.classList.add("on");
    const panel = document.getElementById("panel-" + name);
    if (panel) { panel.classList.add("on"); panel.style.display = "flex"; }
  };

  // ============================================================
  //  Googleログイン
  // ============================================================
  async function doGoogleLogin() {
    try {
      await loginWithGoogle();
      toast("ログインしました", "success");
      location.href = redirect;
    } catch(e) {
      toast(authErrorMessage(e.code), "error");
    }
  }
  document.getElementById("btn-google-login").addEventListener("click", doGoogleLogin);
  document.getElementById("btn-google-register").addEventListener("click", doGoogleLogin);

  // ============================================================
  //  メールログイン
  // ============================================================
  document.getElementById("btn-email-login").addEventListener("click", async () => {
    hideErr("login");
    const email = document.getElementById("login-email").value.trim();
    const pw    = document.getElementById("login-pw").value;
    if (!email || !pw) { showErr("login", "メールアドレスとパスワードを入力してください"); return; }
    try {
      await loginWithEmail(email, pw);
      toast("ログインしました", "success");
      location.href = redirect;
    } catch(e) {
      showErr("login", authErrorMessage(e.code));
    }
  });

  // ============================================================
  //  新規登録
  // ============================================================
  document.getElementById("btn-register").addEventListener("click", async () => {
    hideErr("reg");
    const name  = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const pw    = document.getElementById("reg-pw").value;
    if (!name)          { showErr("reg", "表示名を入力してください"); return; }
    if (!email)         { showErr("reg", "メールアドレスを入力してください"); return; }
    if (pw.length < 6)  { showErr("reg", "パスワードは6文字以上で入力してください"); return; }
    try {
      await registerWithEmail(email, pw, name);
      toast("アカウントを作成しました！", "success");
      location.href = redirect;
    } catch(e) {
      showErr("reg", authErrorMessage(e.code));
    }
  });

  // ============================================================
  //  パスワードリセット
  // ============================================================
  document.getElementById("btn-reset").addEventListener("click", async () => {
    const email = document.getElementById("reset-email").value.trim();
    if (!email) { toast("メールアドレスを入力してください", "error"); return; }
    try {
      await sendResetEmail(email);
      document.getElementById("reset-ok").style.display = "flex";
    } catch(e) {
      toast(authErrorMessage(e.code), "error");
    }
  });

  // ============================================================
  //  パスワード強度
  // ============================================================
  window.updateStrength = function(val) {
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const labels = ["","弱い","普通","強い","とても強い"];
    [1,2,3,4].forEach(i => {
      const b = document.getElementById("pb" + i);
      b.className = "pw-bar" + (i <= score ? " s" + score : "");
    });
    document.getElementById("pw-label").textContent = val ? (labels[score] || "弱い") : "パスワードを入力してください";
  };

  // Enterキーでログイン
  document.getElementById("login-pw").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("btn-email-login").click();
  });
</script>

</body>
</html>
